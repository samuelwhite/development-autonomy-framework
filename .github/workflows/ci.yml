name: preview-quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          pip-version: '26.2.2'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=daf --cov-report=term-missing
      - name: Portable native foundation contracts (not Windows isolation acceptance)
        run: python -m unittest discover -s desktop/native-foundation -p "test_*.py" -v
      - name: Portable diagnostic evidence contracts (no native execution)
        run: python -m unittest discover -s desktop/native-prelaunch -p "test_*.py" -v
      - run: python scripts/check_distribution.py
      - run: python -m build
      - run: python scripts/smoke_wheel.py
      - run: python scripts/smoke_sdist.py
      - run: python -m pip_audit -r requirements-dev.txt --strict

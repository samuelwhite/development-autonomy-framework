name: web-mission-control
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  read-only-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test web/tests/server.test.mjs web/tests/accounts.test.mjs
      - run: npm ci --prefix desktop --ignore-scripts --no-fund
      - run: ./desktop/node_modules/.bin/playwright install --with-deps chromium
      - run: node --test web/tests/browser.test.mjs web/tests/account-browser.test.mjs
      - name: Build and smoke-test Compose from a restrictive checkout
        env:
          DAF_VIEWER_PASSWORD_SOURCE: ${{ runner.temp }}/daf-viewer-password
        run: |
          umask 077
          checkout_dir="$RUNNER_TEMP/daf-restrictive-context"
          mkdir "$checkout_dir"
          git archive HEAD:web | tar --extract --file=- --directory="$checkout_dir" --no-same-permissions
          cd "$checkout_dir"
          test "$(stat -c '%a' server.mjs)" = 600
          test "$(stat -c '%a' public)" = 700
          test "$(stat -c '%a' public/app.js)" = 600
          openssl rand -hex 32 > "$DAF_VIEWER_PASSWORD_SOURCE"
          chmod 0400 "$DAF_VIEWER_PASSWORD_SOURCE"
          sudo chown 1000:1000 "$DAF_VIEWER_PASSWORD_SOURCE"
          if env -u DAF_VIEWER_PASSWORD_SOURCE docker compose config --quiet 2>/dev/null; then
            exit 1
          fi
          docker compose config --quiet
          docker compose up --build --wait
          curl --fail --silent http://127.0.0.1:18080/healthz
          test "$(docker compose exec -T mission-control id -u)" = 1000
          for path in / /style.css /app.js /api/mission-control; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:18080$path")" = 401
          done
          docker compose exec -T mission-control node -e '
            const password = require("node:fs").readFileSync(process.env.DAF_VIEWER_PASSWORD_FILE, "utf8").trim();
            const authorization = "Basic " + Buffer.from("daf:" + password).toString("base64");
            fetch("http://127.0.0.1:8080/", { headers: { authorization } })
              .then(response => { if (!response.ok) process.exitCode = 1; })
              .catch(() => { process.exitCode = 1; });
          '
      - name: Verify interactive accounts bootstrap and restart in Compose
        env:
          DAF_VIEWER_PASSWORD_SOURCE: ${{ runner.temp }}/daf-viewer-password
          DAF_AUTH_STATE_SOURCE: ${{ runner.temp }}/daf-auth-state
          DAF_PUBLIC_ORIGIN: https://daf.example.test
        run: |
          cd "$RUNNER_TEMP/daf-restrictive-context"
          sudo install -d -m 0700 -o 1000 -g 1000 "$DAF_AUTH_STATE_SOURCE"
          docker compose -f compose.yaml -f compose.accounts.yaml config --quiet
          node tests/container-accounts-smoke.mjs
      - name: Remove test container
        if: always()
        env:
          DAF_VIEWER_PASSWORD_SOURCE: ${{ runner.temp }}/daf-viewer-password
        run: |
          checkout_dir="$RUNNER_TEMP/daf-restrictive-context"
          if [ -f "$checkout_dir/compose.yaml" ]; then
            cd "$checkout_dir"
            docker compose down
          fi

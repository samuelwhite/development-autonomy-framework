name: desktop-candidate
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'prototype/**', 'src/daf/**', 'docs/plans/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DAF_TEST_PUBLIC_READ: '1'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check runner-provided Node (no extra GitHub Actions)
        run: |
          node --version
          npm --version
          node -e "const [major,minor]=process.versions.node.split('.').map(Number); if(major<22 || (major===22 && minor<12)) process.exit(1)"
      - run: npm ci --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: node --test ../prototype/simulation.test.cjs
      - run: npm run build
      - name: Archive and extract Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./archive-windows.ps1
          Expand-Archive -LiteralPath ../dist/m1.2-desktop/DAF-M1.2-windows-x64.zip -DestinationPath ../dist/extracted
          "DAF_DESKTOP_EXECUTABLE=$((Resolve-Path ../dist/extracted/DAF-win32-x64/DAF.exe).Path)" >> $env:GITHUB_ENV
      - name: Windows packaged journeys
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Linux sandbox configuration on disposable runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root ../dist/m1.2-desktop/DAF-linux-x64/chrome-sandbox
          sudo chmod 4755 ../dist/m1.2-desktop/DAF-linux-x64/chrome-sandbox
      - name: Linux packaged journeys with sandbox enabled
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Linux review archive
        if: runner.os == 'Linux'
        run: |
          tar -czf ../dist/m1.2-desktop/DAF-M1.2-linux-x64.tar.gz -C ../dist/m1.2-desktop DAF-linux-x64
          sha256sum ../dist/m1.2-desktop/DAF-M1.2-linux-x64.tar.gz > ../dist/m1.2-desktop/DAF-M1.2-linux-x64.tar.gz.sha256
      - name: Validation summary (no artifact upload)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath test-output -Filter '*summary.json' -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content -LiteralPath $_.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          Get-ChildItem -LiteralPath ../dist/m1.2-desktop -Filter '*.metrics.json' -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content -LiteralPath $_.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
